# nginx configuration of the static site inside the image (not the reverse proxy of the server).
# The image runs as a non-root user and listens on an unprivileged port; HTTPS and HSTS are the
# responsibility of the reverse proxy in front of it.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind a reverse proxy the redirects must not contain the internal host or port.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    error_page 404 /404.html;

    # Files under /assets/ have a content hash in their name: they never change.
    # add_header in a location replaces the inherited ones, so the security headers are
    # included in every location.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pages are generated as <route>/index.html; never cached for long, so a new release shows up.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }
}
