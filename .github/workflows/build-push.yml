name: Build and push image

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Su main un run non va annullato da uno successivo: perderebbe il bump della versione.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_NAME: wiki-docs
  # Pull requests build the image but never push it.
  PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      # Serve solo al commit della versione su main; nelle pull request da fork il token resta in sola lettura.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Cronologia completa: serve a calcolare le date di ultimo aggiornamento delle pagine.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and typecheck
        run: |
          npm ci
          npm run typecheck

      # Su main calcola la nuova versione dal messaggio del commit (Conventional Commits: feat = minor,
      # fix/perf = patch, breaking = major; docs/chore non cambiano nulla) e aggiorna VERSION e
      # package.json nell'albero di lavoro, così il build mostra già il numero nuovo. Il commit
      # sul repository avviene in fondo, a build riuscito.
      - name: Bump version
        id: bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          before="$(cat VERSION)"
          node scripts/bump-version.mjs --no-commit --message "$(git log -1 --format=%B)"
          after="$(cat VERSION)"
          echo "value=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" != "$after" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # Scrive la data di ultimo aggiornamento di ogni pagina nel front matter: il container
      # non ha .git. Modifica solo l'albero di lavoro del job, nulla viene committato.
      - name: Inject last-update dates
        run: node scripts/inject-last-update.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Con il tag vX.Y.Z la versione è X.Y.Z; negli altri casi resta vuota e vale il file VERSION.
      - name: Read release version
        id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "value=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on main or on a release tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          no-cache: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.version.outputs.value != '' && format('{0}/{1}:{2}', secrets.DOCKERHUB_USERNAME, env.IMAGE_NAME, steps.version.outputs.value) || '' }}

      # Registra la nuova versione su main. Il push con GITHUB_TOKEN non riavvia il workflow, quindi
      # non ci sono cicli. Si aggiungono solo i file della versione: le date iniettate nel front
      # matter restano fuori dal commit.
      - name: Commit version
        if: steps.bump.outputs.changed == 'true' && env.PUSH == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- VERSION package.json package-lock.json
          git commit -m "chore(version): $NEW_VERSION"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
